name: Metrics

# NOTE: Automated schedule and push triggers are intentionally disabled because
# METRICS_TOKEN is not yet configured in Repository Secrets. Without this secret,
# lowlighter/metrics fails after pulling the docker image (~42-46s) with:
# "Error: You must provide a valid GitHub personal token to gather your metrics"
# causing repeated failure notification emails every 6 hours.
#
# TO RE-ENABLE:
# 1. Create a Personal Access Token (classic) at https://github.com/settings/tokens
#    with `read:user` (and optionally `repo`) scopes.
# 2. Add it to Repo -> Settings -> Secrets and variables -> Actions as `METRICS_TOKEN`.
# 3. Uncomment the schedule trigger below and run via workflow_dispatch to test.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"
  # push:
  #   branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    if: ${{ secrets.METRICS_TOKEN != '' }}

    steps:
      # ------------------------------------------------------------------ #
      # 3D isometric contribution calendar
      # ------------------------------------------------------------------ #
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: afsarudeen
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ------------------------------------------------------------------ #
      # Language breakdown (bytes-weighted)
      # ------------------------------------------------------------------ #
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: afsarudeen
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

      # ------------------------------------------------------------------ #
      # Achievement badges (self-hosted; avoids public trophy instance quotas)
      # ------------------------------------------------------------------ #
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: afsarudeen
          filename: assets/metrics.achievements.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
